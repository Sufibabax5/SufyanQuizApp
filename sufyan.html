<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <!-- CSS link -->
  <link rel="stylesheet" href="sufyan.css">
</head>
<body>
<div>
  <button id="restartBtn"style= "margin-bottom: 500px;height: 50px;width: 130px;font-weight: bolder;font-size: 18px;border-radius: 10px;background-color: goldenrod;">Restart Quiz:</button>
</div>

  <div class="quiz-container">
    <div style="font-size: x-large;color: rgba(72, 0, 255, 0.946);" id="timer">Time Left: 10:00</div>

    <h2 style="color: black;" id="question">Question text</h2>
    <div class="options" id="options"></div>
    <button id="next-btn">Next</button>
  </div>
  <script src="sufyan.js"></script>
</body>
</html>
